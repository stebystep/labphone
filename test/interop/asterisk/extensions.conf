[general]
static=yes
writeprotect=no

[lab]
; 600: echo test - everything you send comes back
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; 601: DTMF test - dial 1 2 3 within 20 s and the call turns into an echo test
exten => 601,1,Answer()
 same => n,Goto(dtmf-test,s,1)

; 1001-1009: call another lab phone
exten => _100X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

[dtmf-test]
exten => s,1,Set(TIMEOUT(digit)=5)
 same => n,WaitExten(20)
exten => 123,1,Verbose(1,DTMF test passed: got 123)
 same => n,Echo()
exten => i,1,Verbose(1,DTMF test: invalid digits ${INVALID_EXTEN})
 same => n,Hangup()
exten => t,1,Hangup()

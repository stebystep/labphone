; Asterisk lab PBX used by test/interop/asterisk.test.js - also a working example for classrooms.
[global]
type=global
user_agent=Asterisk-Lab-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

[phone](!)
type=endpoint
context=lab
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes
direct_media=no

; 1001 and 1002: SIP over TLS with mandatory SDES-SRTP
[1001](phone)
transport=transport-tls
media_encryption=sdes
auth=1001
aors=1001
[1001]
type=auth
auth_type=userpass
username=1001
password=secret1001
[1001]
type=aor
max_contacts=1
remove_existing=yes

[1002](phone)
transport=transport-tls
media_encryption=sdes
auth=1002
aors=1002
[1002]
type=auth
auth_type=userpass
username=1002
password=secret1002
[1002]
type=aor
max_contacts=1
remove_existing=yes

; 1003: plain SIP/UDP + RTP (to compare with the secure setup)
[1003](phone)
transport=transport-udp
auth=1003
aors=1003
[1003]
type=auth
auth_type=userpass
username=1003
password=secret1003
[1003]
type=aor
max_contacts=1
remove_existing=yes
